version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: architect_memory
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  chroma:
    image: chromadb/chroma:latest
    ports:
      - "8000:8000"
    environment:
      IS_PERSISTENT: "TRUE"
    volumes:
      - chroma_data:/chroma/chroma

  app:
    build: .
    ports:
      - "8501:8501"
    env_file: .env
    environment:
      CHROMA_HOST: chroma
      CHROMA_PORT: 8000
      POSTGRES_URI: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/architect_memory
    depends_on:
      - postgres
      - chroma
    volumes:
      - ./output:/app/output
      - ./logs:/app/logs

volumes:
  postgres_data:
  chroma_data: