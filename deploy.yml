name: Deploy to Hostinger VPS

on:
  push:
    branches:
      - main  # Triggers automatically when you push to main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Copy files to VPS via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "."
          target: "/root/AI-Architect"
          rm: false # Crucial: preserves your .env and ChromaDB data on the server

      - name: Execute Docker Compose on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /root/AI-Architect
            # Ensure required directories exist
            mkdir -p output logs
            # Rebuild and restart the containers with zero downtime
            docker compose up -d --build
            # Clean up old images to save server disk space
            docker image prune -f
